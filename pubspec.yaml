name: buuk_luuz
description: Buuk-Luuz — The Compendium. Chama management for East Africa.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Supabase (backend + auth + storage)
  supabase_flutter: ^2.5.6

  # UI & animations
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  lucide_icons: 0.257.0

  # Forms & validation
  reactive_forms: ^17.0.1

  # File & image picking (ID upload)
  file_picker: ^8.1.2
  image_picker: ^1.1.2

  # Local storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Formatting & utilities
  intl: ^0.19.0
  timeago: ^3.7.0
  uuid: ^4.4.2

  # Notifications
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0

  # PDF & reports
  pdf: ^3.11.1
  printing: ^5.13.1

  # Responsive layout
  responsive_framework: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/